[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ccbot"
version = "0.1.0"
description = "Covered-call backtester and paper bot (research, not financial advice)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]
webull = ["webull-openapi-python-sdk==3.0.4"]

[tool.setuptools]
packages = ["ccbot", "ccbot.broker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
